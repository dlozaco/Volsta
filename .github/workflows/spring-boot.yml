name: Spring Boot CI

on:
  push:
    branches: [ "main", "develop" ]
    paths:
      - 'backend/**' 
  pull_request:
    branches: [ "main", "develop" ]
    paths:
      - 'backend/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend 

    # 1. Levantamos la base de datos usando los secretos encriptados
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: ${{ secrets.DB_USER }}
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
          POSTGRES_DB: ${{ secrets.DB_NAME }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Code checkout
      uses: actions/checkout@v4

    - name: Configure JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    - name: Compile and run tests
      # 2. Pasamos los secretos como variables de entorno a Spring Boot
      env:
        SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/${{ secrets.DB_NAME }}
        SPRING_DATASOURCE_USERNAME: ${{ secrets.DB_USER }}
        SPRING_DATASOURCE_PASSWORD: ${{ secrets.DB_PASSWORD }}
        
        # Si tenías otras variables sensibles en tu .env (como JWT), ponlas aquí también:
        # JWT_SECRET: ${{ secrets.JWT_SECRET }}
      run: mvn clean verify